<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--ok:#1a7f4b;--okbg:#e3f5ec;--ng:#c62828;--ngbg:#fdeaea;--ac:#1f4fd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e2229;--tx:#eceff4;--mut:#9aa4b2;--bd:#323944;--ok:#4cc38a;--okbg:#17382a;--ng:#ff7b7b;--ngbg:#3d1d1d;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e2229;--tx:#eceff4;--mut:#9aa4b2;--bd:#323944;--ok:#4cc38a;--okbg:#17382a;--ng:#ff7b7b;--ngbg:#3d1d1d;--ac:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:18px;margin:4px 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.item.ok{border-color:var(--ok)}.item.ng{border-color:var(--ng)}
.it{font-weight:600}.hi{font-size:13px;color:var(--mut);margin:2px 0 8px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:600 16px inherit}
.btns button.on.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btns button.on.ng{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.cnt{display:flex;align-items:center;gap:8px;margin-top:10px}.cnt label{margin:0;flex:1}.cnt select{width:90px}
.prow{display:grid;grid-template-columns:34px 1fr 90px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.prow.bad{background:var(--ngbg);border-radius:8px;padding:6px;border-bottom-color:transparent}
.lt{font-weight:700;font-size:18px;text-align:center}.mut{color:var(--mut);font-size:13px}
.tg{padding:10px 0;border-radius:8px;border:2px solid var(--ok);background:var(--okbg);color:var(--ok);font:600 14px inherit}
.tg.on{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.nb{grid-column:1/-1}.nb .ph,.ent .ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.ent{margin-top:10px}
.row2{display:grid;grid-template-columns:90px 1fr;gap:8px}
.psec{margin-top:12px;padding-top:8px;border-top:1px dashed var(--bd)}
.ph img{width:100%;max-height:220px;object-fit:contain;border-radius:8px;border:1px solid var(--bd);background:#000}
.warn{color:var(--ng);font-size:13px;font-weight:600;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.prog{flex:1;font-size:13px;color:var(--mut)}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 16px inherit}
.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font:600 14px inherit}
.res{font-weight:700}.res.ok{color:var(--ok)}.res.ng{color:var(--ng)}
table.h{width:100%;border-collapse:collapse;font-size:13px}table.h td,table.h th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left;vertical-align:middle}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));color:#fff}
.mk[hidden]{display:none}.mk p{margin:0;font-size:14px;text-align:center}
.mk canvas{max-width:100%;max-height:68vh;margin:auto;touch-action:manipulation;border-radius:6px}
.mk .b{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:10px;padding:12px;z-index:60;display:none;text-align:center;font-weight:600}
.toast.show{display:block}.toast.bad{background:#b3261e}
#prt{display:none}
@media print{.wrap,.bar,.mk,.toast{display:none!important}#prt{display:block}body{background:#fff}@page{size:A4;margin:10mm}}

<body>
<div class="wrap">
  <header class="apphead">
    <img class="brandmark" src="company-logo.jpg" alt="TMKI logo">
    <div class="brandcopy"><h1>VISUAL DIMENSION INSPECTION REPORT</h1></div>
  </header>

  <div class="card"><div class="grid">
    <div><label>Date / Time (auto)</label><input id="dt" readonly></div>
    <div><label>Shift</label><select id="shift"><option>A</option><option>B</option></select></div>
    <div><label>Part Name</label><input id="part" placeholder="Part name"></div>
    <div><label>Lot No.</label><input id="lot" placeholder="Lot no."></div>
    <div><label>Cavity No.</label><input id="cav" placeholder="Enter manually"></div>
    <div><label>Inspector</label><select id="insp"><option value="">-- select --</option><option>Niranjan</option><option>Rakesh</option><option>Lokesh</option><option>Anjali</option><option>Purushottam</option></select></div>
    <div><label>Inspection Type</label><select id="inspectionType"><option value="NPD">1. NPD</option><option value="IPC">2. IPC</option><option value="DAILY VISUAL INSPECTION" selected>3. DAILY VISUAL INSPECTION</option><option value="TRIAL">4. TRIAL</option><option value="CUSTOM">5. Custom</option></select></div>
    <div id="customTypeWrap" hidden><label>Custom Inspection Type</label><input id="customType" placeholder="Enter inspection type"></div>
  </div></div>

  <div id="list"></div>

  <div class="card"><label>Comments</label><textarea id="cm" rows="2"></textarea></div>

  <div class="card"><b>Saved reports</b> <span class="sub">(stored on this phone)</span>
    <div style="overflow-x:auto"><table class="h" id="hist"></table></div>
    <div class="sub" style="margin-top:6px">If Print does not open, tap “Report file”, open the downloaded file in your browser and print it or save as PDF.</div>
    <button class="sec" id="sync" style="margin-top:6px">Upload pending now</button> <button class="sec" id="csv" style="margin-top:6px">Export all as CSV</button>
  </div>
</div>

<div class="bar"><div class="in"><div class="prog" id="prog"></div><button class="pri" id="save">Submit</button></div></div>

<div id="mk" class="mk" hidden>
  <p>Mark the exact defect location on the photo</p>
  <div class="toolbar" id="markToolbar">
    <button type="button" class="tool active" data-tool="select">↖ Select</button>
    <button type="button" class="tool" data-tool="circle">◯ Circle</button>

    <span style="font-size:12px">Color</span>

<script>
// ---- SETUP: paste your Google Apps Script Web App URL and the same secret key as in Code.gs
const CFG={url:"https://script.google.com/macros/s/AKfycbzIBUy2CplGWCHfTAn7-baM6qqqyzshrAf-vs1rVeHbr8uwDZAI5pQMnzOXMGonhQyqig/exec",key:"TMKI"};
// k=name, d=instruction, val=has value, loc=has A-Z locations, lab=singular, pl=plural
const ITEMS=[
{k:"Parting Line Flash OD & ID",d:"Check parting line flash 360° on OD and ID. Enter the value.",val:1},
{k:"Vertical Flash",d:"Check vertical flash 360° inside the cage ID. Enter the value.",val:1},
{k:"Pocket OD Flash",d:"Check OD flash on every pocket. Enter each value.",val:1,loc:1,lab:"Pocket",pl:"Pockets"},
{k:"Pocket ID Flash",d:"Check ID flash on every pocket. Enter each value.",val:1,loc:1,lab:"Pocket",pl:"Pockets"},
{k:"Pillar OD",d:"Check OD flash on every pillar. Enter each value.",val:1,loc:1,lab:"Pillar",pl:"Pillars"},
{k:"Pillar ID",d:"Check ID flash on every pillar. Enter each value.",val:1,loc:1,lab:"Pillar",pl:"Pillars"},
{k:"Prong Flash",d:"Check flash on every prong. Enter each value.",val:1,loc:1,lab:"Prong",pl:"Prongs"},
{k:"Ejector Pin Flash",d:"Check the ejector pin on every pillar. Enter each value.",val:1,loc:1,lab:"Pillar",pl:"Pillars"},
{k:"Dent Mark",d:"Check all areas. No dent marks or line marks allowed. Mark NG where found.",loc:1,lab:"Area",pl:"Areas"},
{k:"Cavity Number",d:"Cavity number must be clearly visible."},
{k:"Cavity Letter",d:"Cavity letter must be clearly visible."},
{k:"Gate & Weld Projection",d:"Check gate and weld projection. If in doubt, inform the senior officer."}
];
const LOC="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=ITEMS.map(()=>({r:"",e:[],p:[]})),cur=null,base=null,marks=[],COUNTS={};
try{COUNTS=JSON.parse(localStorage.getItem("dgbb_counts"))||{}}catch(e){}
const cnt=i=>Math.min(26,Math.max(1,+COUNTS[ITEMS[i].k]||26));
const mkE=(i,j)=>({loc:ITEMS[i].loc?LOC[j]:"",v:"",ng:false,n:"",img:""});
function msg(t,bad){const x=$("toast");x.textContent=t;x.className="toast show"+(bad?" bad":"");clearTimeout(msg.t);msg.t=setTimeout(()=>x.className="toast",4000)}
function stamp(){const d=new Date();return d.toLocaleDateString("en-GB")+" "+d.toTimeString().slice(0,5)}

// ---------- storage
let idb=null,mem=[];
const P=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
function dbOpen(){return new Promise(res=>{try{const r=indexedDB.open("dgbb_flash",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>{idb=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
async function dbAll(){if(!idb)return mem.slice();try{return await P(idb.transaction("rec").objectStore("rec").getAll())}catch(e){return mem.slice()}}
async function dbAdd(rec){if(idb){try{await P(idb.transaction("rec","readwrite").objectStore("rec").add(rec));return}catch(e){}}rec.id=Date.now();mem.push(rec);msg("Storage is blocked. This record is kept only for this session.",1)}
async function dbDel(id){mem=mem.filter(x=>x.id!==id);if(idb)try{await P(idb.transaction("rec","readwrite").objectStore("rec").delete(id))}catch(e){}}

async function dbPut(r){mem=mem.map(x=>x.id===r.id?r:x);if(idb)try{await P(idb.transaction("rec","readwrite").objectStore("rec").put(r))}catch(e){}}
let syncing=false;
async function sync(manual){
  if(syncing)return;manual=manual===true;
  if(!CFG.url||CFG.url.startsWith("PASTE")){if(manual)msg("Sheet link is not set in the app yet.",1);return}
  const pend=(await dbAll()).filter(r=>!r.synced);
  if(!pend.length){if(manual)msg("Everything is already uploaded.");return}
  if(!navigator.onLine){if(manual)msg("No internet. Will upload automatically later.",1);return}
  syncing=true;let ok=0,err="";
  for(const r of pend){try{
    const res=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:CFG.key,rec:r})});
    const j=await res.json();
    if(j.ok){r.synced=true;await dbPut(r);ok++}else{err=j.error||"unknown";break}
  }catch(e){err="network";break}}
  syncing=false;await hist();
  if(ok)msg("Uploaded "+ok+" report(s) to Google Sheet ✔");
  else if(err==="network"){if(manual)msg("Upload failed. Will retry automatically.",1)}
  else if(err)msg("Sheet error: "+err,1)}
// ---------- form
function ngBox(e){return `<div class="ph">${e.img?`<img class="photo-preview-small" src="${e.img}" alt="Marked defect photo"><button class="sec" data-a="rm">Remove photo</button>`:""}</div>`}
function rowHTML(i,j,e){const it=ITEMS[i];
  if(!it.loc)return `<div class="ent" data-j="0">${it.val?`<label>Value (mm)</label><input inputmode="decimal" data-f="v" value="${esc(e.v)}">`:""}<div class="row-note"><button class="photo-btn" type="button" data-a="cam" title="Take or upload photo">📷</button><input class="remark-inline" data-f="n" placeholder="Remarks" value="${esc(e.n)}"></div>${ngBox(e)}</div>`;
  return `<div class="prow ${e.ng?"bad":""}" data-j="${j}"><span class="lt">${e.loc}</span>
  ${it.val?`<input inputmode="decimal" placeholder="mm" data-f="v" value="${esc(e.v)}">`:`<span class="mut">${e.ng?"Defect found":"OK"}</span>`}
  <button class="tg ${e.ng?"on":""}" data-a="tg">${e.ng?"✖ NG":"✔ OK"}</button>
  <button class="photo-btn" type="button" data-a="cam" title="Take or upload photo">📷${e.img?" ✓":""}</button>
  <div class="row-note"><input class="remark-inline" data-f="n" placeholder="Remarks" value="${esc(e.n)}">${ngBox(e)}</div>
  ${e.ng&&!e.img?`<div class="nb mut">NG: attach a photo or enter a remark.</div>`:""}</div>`}
function photoSec(i){
  const it=ITEMS[i],p=S[i].p,st=S[i].r;
  return `<div class="psec">
    <div class="it" style="font-size:14px">📷 Additional photo evidence — add as many photos as required</div>
    ${p.map((x,k)=>`<div class="ent" data-k="${k}">
      <div class="grid">
        <div><label>Location / Area</label>${it.loc
          ? `<select data-pf="loc"><option value="">-- select --</option>${LOC.map(l=>`<option value="${l}"${x.loc===l?" selected":""}>${l}</option>`).join("")}</select>`
          : `<input data-pf="loc" placeholder="General / location" value="${esc(x.loc)}">`}
        </div>
        <div><label>Reading (mm)</label><input inputmode="decimal" data-pf="v" placeholder="Optional" value="${esc(x.v||"")}"></div>
        <div><label>Photo Result</label><select data-pf="r"><option value="ng"${(x.r||(st==="ng"?"ng":"ok"))==="ng"?" selected":""}>NOT OK (NG)</option><option value="ok"${(x.r||(st==="ng"?"ng":"ok"))==="ok"?" selected":""}>OK</option></select></div>
        <div><label>Remark / Defect details</label><input data-pf="n" placeholder="Describe the defect" value="${esc(x.n)}"></div>
      </div>
      <div class="ph">${x.img?`<img src="${x.img}" alt="Annotated inspection evidence"><button class="sec" data-pa="prm">Remove photo</button>`:`<button class="sec" data-pa="pcam">📷 Camera</button><button class="sec" data-pa="pgal">🖼 Gallery</button>`}
      <button class="sec" data-pa="pdel">🗑 Remove entry</button></div>
    </div>`).join("")}
    <button class="sec" data-pa="padd" style="width:100%;margin-top:8px">＋ Add photo / evidence</button>
  </div>`;
}
function cardHTML(i){const it=ITEMS[i],s=S[i];
  return `<div class="card item ${s.r}" id="it${i}" data-i="${i}">
  <div class="it">${i+1}. ${it.k}</div><div class="hi">${it.d}</div>
  <div class="btns"><button class="ok ${s.r==="ok"?"on ok":""}" data-r="ok">✔ OK</button><button class="ng ${s.r==="ng"?"on ng":""}" data-r="ng">✖ NOT OK</button></div>
  ${it.loc&&s.r?`<div class="cnt"><label>Number of ${it.pl.toLowerCase()} to inspect</label><select data-c>${LOC.map((l,n)=>`<option value="${n+1}"${cnt(i)===n+1?" selected":""}>${n+1} (A–${l})</option>`).join("")}</select></div>`:""}
  ${s.r?s.e.map((e,j)=>rowHTML(i,j,e)).join(""):(it.loc?'<div class="mut" style="margin-top:8px">Tap OK or NOT OK to open rows A–Z for entering values.</div>':"")}
  ${s.r?photoSec(i):""}
  ${s.r==="ng"?`<div class="warn">⚠ Inform the supervisor immediately${it.loc?`. Tap NG on the affected ${it.lab.toLowerCase()}.`:""}</div>`:""}</div>`}
function render(){$("list").innerHTML=ITEMS.map((_,i)=>cardHTML(i)).join("");upd()}
function renderItem(i){$("it"+i).outerHTML=cardHTML(i);upd()}
function upd(){const d=S.filter(s=>s.r).length,n=S.filter(s=>s.r==="ng").length;
  $("prog").innerHTML=`${d}/${ITEMS.length} done · <span class="res ${n?"ng":"ok"}">${n?n+" NOT OK":"OK"}</span>`}
function fill(i){const it=ITEMS[i],s=S[i],n=it.loc?cnt(i):1;while(s.e.length<n)s.e.push(mkE(i,s.e.length));s.e.length=n}

$("list").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const card=b.closest(".item"),i=+card.dataset.i,s=S[i],it=ITEMS[i];
  if(b.dataset.r){
    if(b.dataset.r==="ok"&&s.e.some(e=>e.ng)){msg("Un-flag the NG rows first.",1);return}
    s.r=b.dataset.r;fill(i);renderItem(i);return}
  if(b.dataset.pa){const pa=b.dataset.pa,kk=b.closest("[data-k]"),k=kk?+kk.dataset.k:-1;
    if(pa==="padd")s.p.push({loc:"",v:"",r:s.r==="ng"?"ng":"ok",n:"",img:""});
    else if(pa==="pdel")s.p.splice(k,1);
    else if(pa==="prm")s.p[k].img="";
    else{cur={i,k,p:1};const f=$("fi");f.value="";pa==="pcam"?f.setAttribute("capture","environment"):f.removeAttribute("capture");f.click();return}
    renderItem(i);return}
  const a=b.dataset.a,row=b.closest("[data-j]"),j=row?+row.dataset.j:0;
  if(a==="tg"){const e=s.e[j];e.ng=!e.ng;if(e.ng)s.r="ng";else{e.n="";e.img="";if(!s.e.some(x=>x.ng))s.r="ok"}renderItem(i)}
  else if(a==="rm"){s.e[j].img="";renderItem(i)}
  else if(a==="cam"||a==="gal"){cur={i,j};const f=$("fi");f.value="";a==="cam"?f.setAttribute("capture","environment"):f.removeAttribute("capture");f.click()}
});
$("list").addEventListener("input",ev=>{const t=ev.target;if(t.dataset.pf){S[+t.closest(".item").dataset.i].p[+t.closest("[data-k]").dataset.k][t.dataset.pf]=t.value;return}const f=t.dataset.f;if(!f)return;
  S[+t.closest(".item").dataset.i].e[+t.closest("[data-j]").dataset.j][f]=t.value});
$("list").addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.pf){
    const i=+t.closest(".item").dataset.i,k=+t.closest("[data-k]").dataset.k;
    S[i].p[k][t.dataset.pf]=t.value;
    if(t.dataset.pf==="r" && t.value==="ng"){S[i].r="ng";renderItem(i)}
    return;
  }
  if(!( "c" in t.dataset))return;
  const i=+t.closest(".item").dataset.i;COUNTS[ITEMS[i].k]=+t.value;try{localStorage.setItem("dgbb_counts",JSON.stringify(COUNTS))}catch(e){}
  if(!S[i].e.some((e,j)=>j>=+t.value&&e.ng)){fill(i);renderItem(i)}else{msg("Rows after "+LOC[+t.value-1]+" have NG entries. Un-flag them first.",1);renderItem(i)}
});
$("list").addEventListener("keydown",ev=>{if(ev.key!=="Enter"||ev.target.dataset.f!=="v")return;
  ev.preventDefault();const all=[...ev.target.closest(".item").querySelectorAll('input[data-f="v"]')],n=all[all.indexOf(ev.target)+1];n?n.focus():ev.target.blur()});

// ---------- photo + multi-tool annotation
let currentTool="select",currentColor="#ff1744",currentWidth=6,drawing=false,activeMark=null;
function setTool(tool){currentTool=tool;document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===tool));}
document.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.tool)));
document.querySelectorAll("[data-color]").forEach(b=>b.addEventListener("click",()=>{currentColor=b.dataset.color;document.querySelectorAll("[data-color]").forEach(x=>x.classList.toggle("active",x===b));}));
$("markWidth").addEventListener("input",e=>currentWidth=+e.target.value);
$("fi").onchange=e=>{const f=e.target.files[0];if(!f||!cur)return;
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const sc=Math.min(1,1400/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
    base=document.createElement("canvas");base.width=w;base.height=h;base.getContext("2d").drawImage(im,0,0,w,h);
    URL.revokeObjectURL(u);marks=[];const c=$("cv");c.width=w;c.height=h;setTool("circle");draw();$("mk").hidden=false};
  im.onerror=()=>msg("Could not open the photo.",1);im.src=u};
function draw(){const c=$("cv"),x=c.getContext("2d");if(!base)return;x.clearRect(0,0,c.width,c.height);x.drawImage(base,0,0);
  marks.forEach(m=>{const pts=m.points||[];if(!pts.length)return;x.save();x.strokeStyle=m.color||"#ff1744";x.fillStyle=m.color||"#ff1744";x.lineWidth=m.width||6;x.lineCap="round";x.lineJoin="round";
    if(m.type==="highlight"){x.globalAlpha=.38;x.lineWidth=(m.width||6)*4;}
    if(m.type==="text"){x.globalAlpha=1;x.font=`bold ${Math.max(18,(m.width||6)*4)}px Arial`;x.fillText(m.text||"DEFECT",pts[0].x,pts[0].y);}
    else if(m.type==="circle"||m.type==="rect"){const a=pts[0],b=pts[pts.length-1];if(m.type==="circle"){const rx=(b.x-a.x)/2,ry=(b.y-a.y)/2;x.beginPath();x.ellipse(a.x+rx,a.y+ry,Math.max(2,Math.abs(rx)),Math.max(2,Math.abs(ry)),0,0,Math.PI*2);x.stroke()}else{x.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}}
    else if(m.type==="arrow"){const a=pts[0],b=pts[pts.length-1],ang=Math.atan2(b.y-a.y,b.x-a.x),head=Math.max(14,(m.width||6)*3);x.globalAlpha=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x-head*Math.cos(ang-Math.PI/6),b.y-head*Math.sin(ang-Math.PI/6));x.moveTo(b.x,b.y);x.lineTo(b.x-head*Math.cos(ang+Math.PI/6),b.y-head*Math.sin(ang+Math.PI/6));x.stroke()}
    else if(m.type==="freehand"||m.type==="highlight"){x.beginPath();x.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.stroke()}
    x.restore();
  });
}
function canvasPoint(e){const c=$("cv"),r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function distToMark(p,m){const pts=m.points||[];if(!pts.length)return Infinity;return Math.min(...pts.map(q=>Math.hypot(p.x-q.x,p.y-q.y)))}
$("cv").addEventListener("pointerdown",e=>{if(!base)return;const p=canvasPoint(e);if(currentTool==="select")return;if(currentTool==="eraser"){let best=-1,bd=Infinity;marks.forEach((m,i)=>{const d=distToMark(p,m);if(d<bd){bd=d;best=i}});if(best>=0&&bd<Math.max(30,currentWidth*5))marks.splice(best,1);draw();return}
  if(currentTool==="text"){const txt=prompt("Enter defect label:","FLASH");if(txt){marks.push({type:"text",points:[p],text:txt,color:currentColor,width:currentWidth});draw()}return}
  drawing=true;activeMark={type:currentTool,points:[p],color:currentColor,width:currentWidth};marks.push(activeMark);try{$("cv").setPointerCapture(e.pointerId)}catch(_){}draw();});
$("cv").addEventListener("pointermove",e=>{if(!drawing||!activeMark)return;const p=canvasPoint(e);if(activeMark.type==="freehand"||activeMark.type==="highlight")activeMark.points.push(p);else{activeMark.points=[activeMark.points[0],p]}draw()});
function finishDraw(){drawing=false;activeMark=null}
$("cv").addEventListener("pointerup",finishDraw);$("cv").addEventListener("pointercancel",finishDraw);
$("undoMark").onclick=()=>{marks.pop();draw()};
$("clearMarks").onclick=()=>{marks=[];draw()};
$("mc").onclick=()=>{$("mk").hidden=true;drawing=false;activeMark=null};
$("md").onclick=()=>{const u=$("cv").toDataURL("image/jpeg",0.88);if(cur.p)S[cur.i].p[cur.k].img=u;else S[cur.i].e[cur.j].img=u;$("mk").hidden=true;renderItem(cur.i);msg("Marked photo saved with inspection record.")};

// ---------- submit
function check(){
  if(!$("insp").value)return["Select the inspector.","insp"];
  if(!$("lot").value.trim())return["Enter the lot no.","lot"];
  if(!$("cav").value.trim())return["Enter the cavity no.","cav"];
  for(let i=0;i<S.length;i++){const s=S[i],it=ITEMS[i],n=`Item ${i+1} (${it.k})`;
    if(!s.r)return[`${n} is not done yet.`,"it"+i];
    if(s.r==="ng"){
      const hasNgPhoto=(s.p||[]).some(p=>p.r==="ng"&&p.img);
      if(it.loc&&!s.e.some(e=>e.ng)&&!hasNgPhoto)return[`${n}: tap NG on the affected ${it.lab.toLowerCase()} or attach an NG photo with its location.`,"it"+i];
      for(const e of s.e)if((!it.loc||e.ng)&&!e.n.trim()&&!e.img&&!hasNgPhoto)return[`${n}${e.loc?", "+it.lab+" "+e.loc:""}: add a remark or photo.`,"it"+i]}}
  return null}
$("save").onclick=async()=>{const er=check();if(er){msg(er[0],1);const t=$(er[1]);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});if(!er[1].startsWith("it"))t.focus()}return}
  const selectedType=$("inspectionType").value;
  const finalType=selectedType==="CUSTOM"?$("customType").value.trim():selectedType;
  if(!finalType){msg("Enter the custom inspection type.",1);$("customType").focus();return}
  const rec={uid:Date.now().toString(36)+Math.random().toString(36).slice(2,7),synced:false,t:stamp(),shift:$("shift").value,inspectionType:finalType,part:$("part").value,lot:$("lot").value,cav:$("cav").value,insp:$("insp").value,cm:$("cm").value,
    ng:S.filter(s=>s.r==="ng").length,items:S.map((s,i)=>({k:ITEMS[i].k,loc:ITEMS[i].lab||"",val:ITEMS[i].val?1:0,p:s.p.map(x=>({...x})),r:s.r,e:s.e.map(e=>({...e,ng:ITEMS[i].loc?e.ng:s.r==="ng"}))}))};
  await dbAdd(rec);S=ITEMS.map(()=>({r:"",e:[],p:[]}));$("cm").value="";$("inspectionType").value="DAILY VISUAL INSPECTION";$("customType").value="";$("customTypeWrap").hidden=true;render();await hist();window.scrollTo(0,0);
  msg(rec.ng?"Saved. NOT OK items found. Inform the supervisor.":"Saved. All OK.",!!rec.ng);sync()};

// ---------- report
// Logo: loaded from company-logo.jpg and converted to base64 so the downloaded "Report file" also shows it.
// (Optional: you can replace the line below with your original  const COMPANY_LOGO="data:image/jpeg;base64,...";  line.)
let COMPANY_LOGO="company-logo.jpg";
(function(){try{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);COMPANY_LOGO=c.toDataURL("image/jpeg",0.92)}catch(e){}};im.src="company-logo.jpg"}catch(e){}})();

// Print / report styles. No background colours or highlight boxes: plain white page with black lines only.
const RS=`.rp{font:12px/1.35 Arial,sans-serif;color:#000;background:#fff}.rp h2{margin:8px 0 4px;font-size:16px}.rp table{width:100%;border-collapse:collapse;margin:6px 0}.rp td,.rp th{border:1px solid #000;padding:4px 5px;vertical-align:top;text-align:left}.rp .ng{color:#c00;font-weight:700}.rp .ok{color:#060;font-weight:700}.rp .pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rp .pg div.photo-card{border:1px solid #000;padding:6px;border-radius:5px;break-inside:avoid}.rp .pg img{width:100%;max-height:230px;object-fit:contain}.rp .photo-caption{font-size:10px;padding-top:4px}.rp tr{break-inside:avoid}.rp .section-title{padding:6px 0;border:0;border-bottom:1px solid #000;font-weight:700;color:#000}
.rp,.rp *{background:none!important;background-color:#fff!important;box-shadow:none!important;text-shadow:none!important}
.rp .section-title,.rp .ng-title{border:0!important;border-bottom:1px solid #000!important;color:#000!important;padding-left:0!important}
.rp .overall{border-left:0!important;padding-left:0!important}
.rp .report-head{border-bottom:2px solid #000!important}
.rp .report-head h2{color:#000!important}
.rp .report-head img{background:#fff!important}
*{-webkit-print-color-adjust:economy;print-color-adjust:economy}`;
function report(r){
  let rows="",ngPhotos="",otherPhotos="";
  const photoCaption=(i,it,loc,v,result,remark,img)=>`<div class="photo-card"><img src="${img}" alt="Inspection photo"><div class="photo-caption"><b>${i+1}. ${esc(it.k)}</b><br>Inspection Type: ${esc(r.inspectionType||"—")}<br>Part Name: ${esc(r.part||"—")}<br>Lot No.: ${esc(r.lot||"—")} · Cavity No.: ${esc(r.cav||"—")}<br>Date / Time: ${esc(r.t||"—")} · Shift: ${esc(r.shift||"—")}<br>Inspector: ${esc(r.insp||"—")}<br>${loc?"Location: "+esc(loc)+"<br>":""}Reading: ${esc(v||"—")}${v?" mm":""}<br>Result: <b class="${result==="NG"?"ng":"ok"}">${result==="NG"?"NOT OK (NG)":"OK / Evidence"}</b><br>Remark / Defect: ${esc(remark||"—")}</div></div>`;
  r.items.forEach((it,i)=>{
    const allEntries=Array.isArray(it.e)?it.e:[];
    const entries=it.loc
      ? allEntries.filter(e=>String(e.v??"").trim()!==""||e.ng||String(e.n||"").trim()!==""||!!e.img)
      : allEntries;
    if(it.loc && entries.length===0) return;
    const rd=it.loc
      ? entries.map(e=>`<span class="${e.ng?"ng":"ok"}">${esc(e.loc)}${it.val?": "+esc(e.v||"—"):""}${e.ng?" (NG)":" (OK)"}</span>`).join("   ")
      : (it.val?esc((entries[0]&&entries[0].v)?entries[0].v+" mm":"—"):"—");
    const rm=entries.filter(e=>e.n).map(e=>(e.loc?esc(e.loc)+": ":"")+esc(e.n)).join("; ");
    rows+=`<tr><td>${i+1}</td><td>${esc(it.k)}</td><td class="${it.r}">${it.r==="ok"?"OK":"NOT OK"}</td><td>${rd||"—"}</td><td>${rm||"—"}</td></tr>`;
    entries.forEach(e=>{
      if(!e.img)return;
      const isNg=!!e.ng || (!it.loc && it.r==="ng");
      const loc=e.loc?(it.loc?it.loc+" "+e.loc:e.loc):"";
      const html=photoCaption(i,it,loc,e.v,isNg?"NG":"OK / Evidence",e.n,e.img);
      if(isNg)ngPhotos+=html;else otherPhotos+=html;
    });
    (Array.isArray(it.p)?it.p:[]).forEach(x=>{
      if(!x.img)return;
      const isNg=x.r==="ng";
      const loc=x.loc?(it.loc?it.loc+" "+x.loc:x.loc):"General / item area";
      const html=photoCaption(i,it,loc,x.v,isNg?"NG":"OK / Evidence",x.n,x.img);
      if(isNg)ngPhotos+=html;else otherPhotos+=html;
    });
  });
  const totalNg=Number(r.ng||0);
  return `<div class="report-head" style="display:flex;align-items:center;gap:18px;border-bottom:2px solid #000;padding:0 0 10px;margin-bottom:10px"><img src="${COMPANY_LOGO}" alt="TMKI logo" style="width:260px;max-height:60px;object-fit:contain"><div style="flex:1;text-align:center"><h2 style="font-size:19px;line-height:1.25;color:#000;margin:0">VISUAL DIMENSION INSPECTION REPORT</h2><div style="font-size:10px;color:#000;margin-top:5px">Doc No.: CD-I-025-02 · Rev. 00</div></div></div>
  <table class="meta"><tr><td><b>Date / Time</b><br>${esc(r.t||"—")}</td><td><b>Shift</b><br>${esc(r.shift||"—")}</td><td><b>Inspector</b><br>${esc(r.insp||"—")}</td></tr>
  <tr><td><b>Inspection Type</b><br>${esc(r.inspectionType||"—")}</td><td><b>Part Name</b><br>${esc(r.part||"—")}</td><td><b>Lot No. / Cavity No.</b><br>${esc(r.lot||"—")} / ${esc(r.cav||"—")}</td></tr></table>
  <table><thead><tr><th>#</th><th>Inspection Characteristic</th><th>Result</th><th>Recorded Readings / Locations</th><th>Remarks</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="overall" style="padding:8px 0"><b>Overall result:</b> <span class="${totalNg?"ng":"ok"}">${totalNg?totalNg+" NOT OK inspection item(s)":"ALL CHECKED ITEMS OK"}</span></p>
  ${r.cm?`<p><b>General comments:</b> ${esc(r.cm)}</p>`:""}
  ${ngPhotos?`<h2 class="section-title ng-title">NG DEFECT PHOTO DETAILS</h2><div class="pg">${ngPhotos}</div>`:""}
  ${otherPhotos?`<h2 class="section-title">ADDITIONAL PHOTO EVIDENCE</h2><div class="pg">${otherPhotos}</div>`:""}
  <p style="font-size:9px;color:#000;margin-top:12px">Blank A–Z locations without readings, NG status, remarks or photo evidence are omitted. Signature blocks are not included.</p>`;
}

async function getRec(id){return(await dbAll()).find(x=>x.id===id)}
function printRec(r){$("prt").innerHTML=`<style>${RS}</style>`+report(r);try{window.print()}catch(e){msg("Printing is blocked. Use “Report file”.",1)}}
async function saveFile(name,data){try{const d=await claude.use("downloads");if(d){await d.save({filename:name,data});return}}catch(e){}msg("Download is not available here.",1)}
const fn=r=>("TMKI_Flash_Inspection_"+r.lot+"_"+r.cav+"_"+r.t).replace(/[^\w-]+/g,"_");

async function hist(){const a=(await dbAll()).sort((x,y)=>y.id-x.id).slice(0,15);
  $("hist").innerHTML="<tr><th>Time / Lot</th><th>Result</th><th></th></tr>"+(a.length?a.map(x=>`<tr><td>${esc(x.t)}<br>Lot ${esc(x.lot)} · Cav ${esc(x.cav)}</td><td class="res ${x.ng?"ng":"ok"}">${x.ng?x.ng+" NG":"OK"}<br><span class="mut">${x.synced?"✔ In Sheet":"⏳ Pending"}</span></td>
  <td><button class="sec" data-p="${x.id}">🖨 Print</button> <button class="sec" data-d="${x.id}">Report file</button> <button class="sec" data-x="${x.id}">🗑</button></td></tr>`).join(""):"<tr><td colspan=3>No reports yet</td></tr>")}
$("hist").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.p)printRec(await getRec(+b.dataset.p));
  else if(b.dataset.d){const r=await getRec(+b.dataset.d);
    saveFile(fn(r)+".html",`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VISUAL DIMENSION INSPECTION REPORT</title><style>${RS}body{margin:12px;background:#fff}@page{size:A4;margin:10mm}</style></head><body><div class="rp">${report(r)}</div></body></html>`)}
  else if(b.dataset.x){if(b.dataset.s!=="1"){b.dataset.s="1";b.textContent="Sure?";setTimeout(()=>{b.dataset.s="";b.textContent="🗑"},3000)}else{await dbDel(+b.dataset.x);hist()}}});
$("csv").onclick=async()=>{
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const L=[["Time","Shift","Inspection Type","Part","Lot","Cavity","Inspector","Item","Result","Location","Value","Remark","Photo"]];
  (await dbAll()).forEach(r=>{
    r.items.forEach(it=>{
      const entries=(it.e||[]).filter(e=>!it.loc||String(e.v??"").trim()!==""||e.ng||String(e.n||"").trim()!==""||!!e.img);
      entries.forEach(e=>L.push([r.t,r.shift,r.inspectionType||"",r.part,r.lot,r.cav,r.insp,it.k,e.ng?"NOT OK":"OK",e.loc,e.v,e.n,e.img?"yes":""]));
      (it.p||[]).forEach(x=>{if(x.img)L.push([r.t,r.shift,r.inspectionType||"",r.part,r.lot,r.cav,r.insp,it.k,x.r==="ng"?"NOT OK":"OK",x.loc,x.v,x.n,"yes"])});
    });
  });
  saveFile("TMKI_flash_inspection_all.csv","\ufeff"+L.map(r=>r.map(q).join(",")).join("\n"));
};

$("inspectionType").addEventListener("change",()=>{
  const custom=$("inspectionType").value==="CUSTOM";
  $("customTypeWrap").hidden=!custom;
  if(custom) $("customType").focus();
});
$("dt").value=stamp();setInterval(()=>$("dt").value=stamp(),30000);
$("sync").onclick=()=>sync(true);window.addEventListener("online",()=>sync());
render();dbOpen().then(hist).then(()=>sync());
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
